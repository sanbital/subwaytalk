name: Runtime Check

on:
  push:
    branches: [main, "agent/**", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # check:build 가 app.js 를 src/ 에서 다시 빌드해 커밋본과 대조한다.
      # 번들과 소스가 갈라지면(과거에 관리자/광고주 화면이 통째로 사라진 원인) 여기서 실패한다.
      - run: npm run check
